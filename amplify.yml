version: 1
frontend:
  phases:
    preBuild:
      commands:
        - cd frontend/frontend
        - npm ci
    build:
      commands:
        - env | grep -e NEXT_PUBLIC_ >> .env.production
        - npm run build
  artifacts:
    baseDirectory: frontend/frontend/.next
    files:
      - '**/*'
  cache:
    paths:
      - frontend/frontend/node_modules/**/*
      - frontend/frontend/.next/cache/**/*
